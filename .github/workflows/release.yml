# This Github Actions workflow will build and publish a Docker image when the "release" tag is
# added to a commit.
#
# To create or move the "release" tag to the latest commit on main:
#   git checkout main
#   git pull origin main
#   git tag -f release
#   git push origin release --force
#
# Or, to delete and recreate the tag without --force:
#   git tag -d release
#   git push origin :refs/tags/release
#   git tag release
#   git push origin release

name: Docker Release

on:
  push:
    tags:
      - 'release'

jobs:
  docker:
    runs-on: ubuntu-latest
    # 1. ADD THIS LINE so GitHub knows to look inside your "docker-env"
    environment: docker-env
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ] || [ -z "$DOCKER_REGISTRY" ]; then
            echo "Required Docker secrets are missing."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
   # 1. Build the image locally on the runner
      - name: Build Docker image
        run: docker build -t fitnessjiffy:latest .

    # 2. Tag it using your Docker Hub username (DO NOT let it default to library/)
      - name: Tag Docker image
      # Combined the Registry (if any) and your Username namespace path
        run: docker tag fitnessjiffy:latest ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/fitnessjiffy:latest

      - name: Push Docker image
      # Directs the push request straight into your personal user workspace
        run: docker push ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/fitnessjiffy:latest